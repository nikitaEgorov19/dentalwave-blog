<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - DENTAL journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --gold: #d4af37;
            --gold-dark: #996515;
            --black: #0a0a0a;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-400: #ced4da;
            --gray-800: #343a40;
            --warning: #ffc107;
            --danger: #e74c3c;
            --success: #27ae60;
            --info: #17a2b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-100);
            color: var(--black);
            line-height: 1.6;
        }
        
        header {
            background: var(--black);
            color: var(--white);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        header a {
            color: var(--white);
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            border: 2px solid var(--gold);
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        header a:hover {
            background: var(--gold);
            color: var(--black);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .search-section {
            margin-bottom: 2rem;
        }
        
        .search-box {
            width: 100%;
            padding: 1.1rem 1.5rem;
            border: 2px solid var(--gold);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--white);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--gold-dark);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        
        .form-section {
            background: var(--white);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-200);
        }
        
        .form-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--black);
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--gold);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: var(--black);
        }
        
        .form-control {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            background: var(--white);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
        
        textarea.form-control.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            font-size: 1.2rem;
            padding: 2rem;
            box-sizing: border-box;
            background: white;
            border: 2px solid var(--gold);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        
        .btn {
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--black);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }
        
        .btn-edit {
            background: var(--gold);
            color: var(--black);
            padding: 0.6rem 1.2rem;
            margin-right: 0.5rem;
        }
        
        .btn-edit:hover {
            background: var(--gold-dark);
            color: var(--white);
        }
        
        .btn-delete {
            background: var(--danger);
            color: var(--white);
            padding: 0.6rem 1.2rem;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        .btn-cancel {
            background: var(--gray-200);
            color: var(--black);
            margin-left: 0.5rem;
        }
        
        .btn-cancel:hover {
            background: var(--gray-800);
            color: var(--white);
        }
        
        .btn-secondary {
            background: var(--gray-200);
            color: var(--black);
        }
        
        .btn-secondary:hover {
            background: var(--gray-300);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #219653;
        }
        
        .btn-warning {
            background: var(--warning);
            color: black;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .category-tag {
            display: inline-block;
            background: var(--black);
            color: var(--gold);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        
        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        thead {
            background: var(--black);
            color: var(--white);
        }
        
        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        
        tbody tr {
            border-bottom: 1px solid var(--gray-200);
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: var(--gray-100);
        }
        
        td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        .actions-cell {
            white-space: nowrap;
        }
        
        @media (max-width: 768px) {
            .actions-cell {
                white-space: normal;
            }
            .actions-cell .btn {
                display: block;
                width: 100%;
                margin-bottom: 0.5rem;
            }
            .actions-cell .btn:last-child {
                margin-bottom: 0;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray-800);
        }
        
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .form-section { padding: 1.5rem; }
            .articles-table { display: block; overflow-x: auto; }
            .btn { padding: 0.6rem 1rem; font-size: 0.85rem; }
            .form-row { grid-template-columns: 1fr; }
        }
        
        /* New styles for improved layout */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-published {
            background: var(--success);
            color: white;
        }
        
        .status-pending {
            background: var(--warning);
            color: black;
        }
        
        .status-rejected {
            background: var(--danger);
            color: white;
        }
        
        .status-select {
            padding: 0.9rem;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .status-select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        
        .optional-fields {
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .optional-fields h4 {
            font-size: 0.9rem;
            color: var(--gray-300);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--gray-200);
        }
        
        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        
        .editor-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--gray-200);
            background: var(--white);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .editor-btn:hover {
            border-color: var(--gold);
            background: var(--gray-100);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast-success {
            background: var(--success);
        }
        
        .toast-error {
            background: var(--danger);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: var(--white);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        
        .modal.show .modal-content {
            transform: translateY(0);
        }
        
        .modal h3 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 1rem;
            color: var(--black);
        }
        
        .modal p {
            margin-bottom: 1.5rem;
            color: var(--gray-300);
        }
        
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <header>
        <h1>DENTAL journal — Админ</h1>
        <a href="/" target="_blank" class="btn btn-primary" style="text-decoration: none;">🌐 На сайт</a>
    </header>
    
        <div class="container">
            <!-- Header with Admin & Search -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div class="search-section" style="flex: 1; max-width: 500px;">
                    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск статей по названию, автору или содержанию...">
                </div>
                <div style="display: flex; gap: 0.8rem; align-items: center;">
                    <span id="userDisplay" style="color: var(--white); font-size: 0.9rem;"></span>
                    <a href="/" target="_blank" class="btn btn-primary" style="text-decoration: none;">🌐 На сайт</a>
                    <button class="btn btn-secondary" onclick="logout()" style="padding: 0.6rem 1.2rem;">Выйти</button>
                </div>
            </div>
        
            <!-- Category Management -->
            <div class="form-section">
                <h2>Управление разделами</h2>
                <div class="form-row" style="margin-bottom: 1rem;">
                    <div>
                        <input type="text" id="newCategory" class="form-control" placeholder="Название нового раздела">
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-primary" onclick="addCategory()" style="white-space: nowrap;">+ Добавить раздел</button>
                    </div>
                </div>
                <div id="categoriesList" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
            </div>
        
            <!-- Add/Edit Article Form -->
        <div class="form-section">
            <h2 id="formTitle">Добавить статью</h2>
            <form id="articleForm">
                <input type="hidden" id="articleId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Заголовок <span style="color: var(--danger);">*</span></label>
                        <input type="text" id="title" class="form-control" required placeholder="Название статьи">
                    </div>
                    <div class="form-group">
                        <label>Автор <span style="color: var(--danger);">*</span></label>
                        <input type="text" id="author" class="form-control" required placeholder="ФИО автора">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email автора <span style="color: var(--danger);">*</span></label>
                        <input type="email" id="authorEmail" class="form-control" required placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>Статус статьи <span style="color: var(--danger);">*</span></label>
                        <select id="status" class="status-select">
                            <option value="published">Опубликовано</option>
                            <option value="pending" selected>На модерации</option>
                            <option value="rejected">Отклонено</option>
                        </select>
                    </div>
                </div>

                <div class="optional-fields">
                    <h4>Контактная информация (необязательно)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" id="authorPhone" class="form-control" placeholder="+7 (999) 000-00-00">
                        </div>
                        <div class="form-group">
                            <label>Ссылка на соц. сеть</label>
                            <input type="url" id="authorSocial" class="form-control" placeholder="https://vk.com/username">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Разделы <span style="color: var(--danger);">*</span></label>
                    <div id="categoriesCheckboxes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.5rem;"></div>
                </div>

                <div class="form-group">
                    <label>Содержание <span style="color: var(--danger);">*</span></label>
                    <div class="editor-toolbar">
                        <button type="button" class="editor-btn" onclick="toggleFullscreen('content')">⤢</button>
                    </div>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <textarea id="content" class="form-control" required style="flex: 1; min-height: 200px; font-family: 'Inter', monospace; resize: none;" placeholder="Введите текст статьи..."></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>Аннотация</label>
                    <textarea id="annotation" class="form-control" rows="4" style="resize: none;" placeholder="Краткое описание статьи (не более 6 строк)..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success" id="submitBtn" style="flex: 1;">
                        <span id="submitText">Добавить статью</span>
                    </button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn" style="display: none;" onclick="resetForm()">Отмена редактирования</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Очистить форму</button>
                </div>
            </form>
        </div>
        
            <!-- Articles Table -->
            <div class="form-section">
                <h2>Список статей</h2>
                <div class="form-row" style="margin-bottom: 1rem;">
                    <div>
                        <select id="filterStatus" class="status-select" onchange="filterArticles()" style="min-width: 150px;">
                            <option value="all">Все статусы</option>
                            <option value="published">Опубликовано</option>
                            <option value="pending">На модерации</option>
                            <option value="rejected">Отклонено</option>
                        </select>
                    </div>
                    <div style="text-align: right; color: var(--gray-300);" id="articleCount">Статей: 0</div>
                </div>
                <div class="articles-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Заголовок</th>
                                <th>Разделы</th>
                                <th>Автор</th>
                                <th>Дата</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="articlesTable"></tbody>
                    </table>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <h3>Статей не найдено</h3>
                        <p>Создайте первую статью, используя форму выше</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for Confirmation -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <h3 id="modalTitle">Подтверждение</h3>
                <p id="modalText">Вы уверены?</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="btn btn-danger" id="modalConfirmBtn" onclick="confirmModal()">Подтвердить</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast toast-success"></div>

        <script>
        let isEditMode = false;
        let BASE_URL = '';
        let categories = [];
        let allArticles = [];
        let adminAuth = '';
        let pendingModalCallback = null;
        
        // Initialize
        async function init() {
            await getConfig();
            adminAuth = askAuth();
            if (!adminAuth) return;
            const valid = await verifyAuth(adminAuth);
            if (!valid) {
                alert('Неверный логин или пароль');
                window.location.href = '/';
                return;
            }
            await loadCategories();
            await loadArticles();
            
            // Setup search
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        function openModal(title, text, confirmCallback) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalConfirmBtn').className = 'btn btn-danger';
            document.getElementById('modalConfirmBtn').textContent = 'Подтвердить';
            pendingModalCallback = confirmCallback;
            document.getElementById('modal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            pendingModalCallback = null;
        }
        
        function confirmModal() {
            if (pendingModalCallback) {
                pendingModalCallback();
                closeModal();
            }
        }
        
        function logout() {
            window.location.href = '/';
        }
        
        async function getConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                BASE_URL = data.baseUrl;
                document.getElementById('userDisplay').textContent = 'Админ-режим';
            } catch (e) { BASE_URL = ''; }
        }
        
        function askAuth() {
            const user = prompt('Логин:');
            if (!user) { window.location.href = '/'; return null; }
            const pass = prompt('Пароль:');
            if (!user || !pass) { window.location.href = '/'; return null; }
            return btoa(user + ':' + pass);
        }
        
        async function verifyAuth(auth) {
            const res = await fetch('/api/verify', { 
                method: 'POST',
                headers: { 'Authorization': 'Basic ' + auth } 
            });
            return res.ok;
        }
        
        // Search
        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            const filter = document.getElementById('filterStatus').value;
            let filtered = allArticles.filter(a => {
                const matchSearch = !query || 
                    a.title.toLowerCase().includes(query) ||
                    a.author.toLowerCase().includes(query) ||
                    a.content.toLowerCase().includes(query) ||
                    (a.annotation && a.annotation.toLowerCase().includes(query));
                const matchStatus = filter === 'all' || a.status === filter;
                return matchSearch && matchStatus;
            });
            renderArticlesTable(filtered);
        }
        
        function filterArticles() {
            handleSearch({ target: { value: document.getElementById('searchInput').value } });
        }
        
        // Fullscreen toggle for textareas
        function toggleFullscreen(textareaId) {
            const textarea = document.getElementById(textareaId);
            const isFullscreen = textarea.classList.contains('fullscreen');
            
            if (isFullscreen) {
                textarea.classList.remove('fullscreen');
                textarea.style.position = '';
                textarea.style.top = '';
                textarea.style.left = '';
                textarea.style.width = '';
                textarea.style.height = '';
                textarea.style.zIndex = '';
                textarea.style.fontSize = '';
                textarea.style.padding = '';
                textarea.style.boxSizing = '';
                const closeButtons = document.querySelectorAll('.fullscreen-close');
                closeButtons.forEach(button => button.remove());
            } else {
                textarea.classList.add('fullscreen');
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '0';
                textarea.style.width = '100vw';
                textarea.style.height = '100vh';
                textarea.style.zIndex = '1000';
                textarea.style.fontSize = '1.2rem';
                textarea.style.padding = '2rem';
                textarea.style.boxSizing = 'border-box';
                
                const closeButton = document.createElement('button');
                closeButton.className = 'fullscreen-close';
                closeButton.innerHTML = '&times;';
                closeButton.style.cssText = 'position:fixed;top:20px;right:20px;width:40px;height:40px;background:rgba(0,0,0,0.8);color:white;border:none;border-radius:50%;font-size:24px;cursor:pointer;z-index:1001;display:flex;align-items:center;justify-content:center;';
                closeButton.onclick = () => toggleFullscreen(textareaId);
                document.body.appendChild(closeButton);
                textarea.focus();
            }
        }
        
        async function addCategory() {
            const name = document.getElementById('newCategory').value.trim();
            if (!name) { showToast('Введите название раздела', 'error'); return; }
            if (!adminAuth) return;
            const res = await fetch('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + adminAuth },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                document.getElementById('newCategory').value = '';
                await loadCategories();
                showToast('Раздел добавлен');
            } else {
                showToast('Ошибка при добавлении', 'error');
            }
        }
        
        async function loadCategories() {
            try {
                categories = await fetch('/api/categories').then(r => r.json());
                renderCategoriesUI();
            } catch (e) { console.error(e); }
        }
        
        function renderCategoriesUI() {
            // Checkboxes for form
            const checkboxesContainer = document.getElementById('categoriesCheckboxes');
            if (checkboxesContainer) {
                checkboxesContainer.innerHTML = categories.map(c => 
                    `<label class="category-tag" style="cursor:pointer;display:inline-flex;align-items:center;gap:0.5rem;padding:0.4rem 0.8rem;background:var(--gray-100);color:var(--black);border:2px solid var(--gray-200);transition:all 0.2s;">
                        <input type="checkbox" name="category" value="${c.id}" style="width:auto;margin:0;cursor:pointer;"> ${c.name}
                    </label>`
                ).join('');
            }
            
            // Management list
            const categoriesList = document.getElementById('categoriesList');
            if (categoriesList) {
                categoriesList.innerHTML = categories.map(c => 
                    `<span class="category-tag" style="display:inline-flex;align-items:center;cursor:pointer;" title="Кликните для удаления" onclick="deleteCategory(${c.id})">
                        ${escapeHtml(c.name)}
                        <span style="margin-left:0.3rem;font-size:0.7rem;">×</span>
                    </span>`
                ).join('');
            }
        }
        
        async function deleteCategory(id) {
            if (!adminAuth) return;
            openModal('Удалить раздел', 'Удалить этот раздел? Статьи с этим разделом не будут удалены.', async () => {
                const res = await fetch('/api/categories/' + id, { method: 'DELETE', headers: { 'Authorization': 'Basic ' + adminAuth } });
                if (res.ok) {
                    await loadCategories();
                    loadArticles();
                    showToast('Раздел удален');
                } else {
                    showToast('Ошибка при удалении', 'error');
                }
            });
        }
        
        // Articles
        async function loadArticles() {
            try {
                allArticles = await fetch('/api/articles').then(r => r.json());
                renderArticlesTable(allArticles);
            } catch (error) { console.error('Error:', error); }
        }
        
        function getStatusBadge(status) {
            const statusMap = {
                published: { class: 'status-published', text: 'Опубликовано' },
                pending: { class: 'status-pending', text: 'На модерации' },
                rejected: { class: 'status-rejected', text: 'Отклонено' }
            };
            const s = statusMap[status] || statusMap.pending;
            return `<span class="status-badge ${s.class}">${s.text}</span>`;
        }
        
        function renderArticlesTable(articlesToRender) {
            const tbody = document.getElementById('articlesTable');
            const emptyState = document.getElementById('emptyState');
            const count = document.getElementById('articleCount');
            count.textContent = `Статей: ${articlesToRender.length}`;
            
            if (articlesToRender.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = articlesToRender.map(article => {
                let catNames = '';
                if (article.categories && Array.isArray(article.categories)) {
                    const catObj = categories.filter(c => article.categories.includes(c.id));
                    catNames = catObj.map(c => `<span class="category-tag">${escapeHtml(c.name)}</span>`).join('');
                } else {
                    catNames = '<span class="category-tag">Разное</span>';
                }
                
                const statusBadge = getStatusBadge(article.status || 'pending');
                
                return `
                    <tr>
                        <td>#${article.id}</td>
                        <td><strong>${escapeHtml(article.title)}</strong></td>
                        <td>${catNames}</td>
                        <td>${escapeHtml(article.author)}</td>
                        <td>${article.date}</td>
                        <td>${statusBadge}</td>
                        <td class="actions-cell">
                            <button class="btn btn-edit" onclick="editArticle(${article.id})">✏️ Редактировать</button>
                            <button class="btn btn-danger" onclick="deleteArticle(${article.id})">🗑️ Удалить</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }
        
        function resetForm() {
            isEditMode = false;
            document.getElementById('articleForm').reset();
            document.getElementById('articleId').value = '';
            document.getElementById('status').value = 'pending';
            document.getElementById('formTitle').textContent = 'Добавить статью';
            document.getElementById('submitBtn').innerHTML = 'Добавить статью';
            document.getElementById('cancelBtn').style.display = 'none';
            loadCategories();
        }
        
        // Form submission
        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!adminAuth) { showToast('Сессия истекла', 'error'); return; }
            
            const id = document.getElementById('articleId').value;
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const authorEmail = document.getElementById('authorEmail').value.trim();
            const authorPhone = document.getElementById('authorPhone').value.trim();
            const authorSocial = document.getElementById('authorSocial').value.trim();
            const content = document.getElementById('content').value.trim();
            const annotation = document.getElementById('annotation').value.trim();
            const status = document.getElementById('status').value;
            
            if (!title) { showToast('Введите заголовок', 'error'); return; }
            if (!author) { showToast('Введите автора', 'error'); return; }
            
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!authorEmail || !emailPattern.test(authorEmail)) {
                showToast('Введите корректный email', 'error');
                return;
            }
            
            const checkedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => parseInt(cb.value));
            if (checkedCategories.length === 0) { showToast('Выберите хотя бы один раздел', 'error'); return; }
            if (!content) { showToast('Введите содержание', 'error'); return; }
            
            const data = { 
                title, author, authorEmail, authorPhone, authorSocial,
                content, annotation, categories: checkedCategories, status
            };
            
            try {
                let response;
                if (isEditMode) {
                    response = await fetch('/api/articles/' + id, { 
                        method: 'PUT', 
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + adminAuth }, 
                        body: JSON.stringify(data) 
                    });
                } else {
                    response = await fetch('/api/articles', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + adminAuth }, 
                        body: JSON.stringify(data) 
                    });
                }
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Ошибка при сохранении');
                }
                
                showToast(isEditMode ? 'Изменения сохранены' : 'Статья добавлена');
                resetForm();
                loadArticles();
            } catch (error) {
                console.error('Error:', error);
                showToast(error.message, 'error');
            }
        });
        
        async function editArticle(id) {
            const article = allArticles.find(a => a.id === id);
            if (!article) return;
            
            isEditMode = true;
            document.getElementById('articleId').value = id;
            document.getElementById('title').value = article.title;
            document.getElementById('author').value = article.author;
            document.getElementById('authorEmail').value = article.authorEmail || '';
            document.getElementById('authorPhone').value = article.authorPhone || '';
            document.getElementById('authorSocial').value = article.authorSocial || '';
            document.getElementById('content').value = article.content;
            document.getElementById('annotation').value = article.annotation || '';
            document.getElementById('status').value = article.status || 'pending';
            
            // Set checkboxes
            document.querySelectorAll('input[name="category"]').forEach(cb => {
                cb.checked = (article.categories || []).includes(parseInt(cb.value));
            });
            
            document.getElementById('formTitle').textContent = 'Редактировать статью';
            document.getElementById('submitBtn').innerHTML = 'Сохранить изменения';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        async function deleteArticle(id) {
            const article = allArticles.find(a => a.id === id);
            if (!article) return;
            openModal('Удалить статью', `Удалить "${article.title}"? Это действие необратимо.`, async () => {
                try {
                    const response = await fetch('/api/articles/' + id, { 
                        method: 'DELETE', 
                        headers: { 'Authorization': 'Basic ' + adminAuth } 
                    });
                    if (response.ok) {
                        loadArticles();
                        showToast('Статья удалена');
                    } else {
                        const errorData = await response.json();
                        showToast(errorData.error || 'Ошибка при удалении', 'error');
                    }
                } catch (err) {
                    showToast('Ошибка при удалении', 'error');
                }
            });
        }
        
        // Start
        init();
    </script>
</body>
</html>
